<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Renbarger</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ── HEADER ── -->
    <header class="header">
        <div class="artist-name">Alex Renbarger</div>
        <nav>
            <a href="#home">Home</a>
            <a href="/alexrenbarger/work.html">Work</a>
            <a href="/alexrenbarger/about.html">About</a>
        </nav>
    </header>

    <!-- ── GALLERY ── -->
    <main class="main-content">
        <section id="work" class="gallery">
            <img src="assets/images/image19.jpg" alt="Cracked, 2025"
                data-title="Cracked, 2025" data-medium="Oil on canvas" data-size="22&quot; x 30&quot;"
                onclick="openModal(this)">
            <img src="assets/images/image27.jpg" alt="What Remains, 2025"
                data-title="What Remains, 2025" data-medium="Oil on canvas" data-size="30&quot; x 30&quot;"
                onclick="openModal(this)">
            <img src="assets/images/image25.jpg" alt="False Reconstruction, 2025"
                data-title="False Reconstruction, 2025" data-medium="Oil on canvas" data-size="8&quot; x 8&quot;"
                onclick="openModal(this)">
            <img src="assets/images/image11.jpg" alt="Shadows, 2024" data-title="Shadows, 2024"
                data-medium="Oil on canvas" data-size="14&quot; x 14&quot;"
                onclick="openModal(this)">
            <img src="assets/images/image17.jpg" alt="Localized Grime, 2024"
                data-title="Localized Grime, 2024" data-medium="Oil on canvas" data-size="30&quot; x 30&quot;"
                onclick="openModal(this)">
            <img src="assets/images/image6.jpg" alt="Reflection, 2024"
                data-title="Reflection, 2024" data-medium="Oil on canvas" data-size="14&quot; x 14&quot;"
                onclick="openModal(this)">
        </section>
    </main>

    <!-- ── FOOTER / CONTACT ── -->
    <section id="contact" class="contact-section">
        <h2>Contact</h2>
        <p>Email: renbargeralex@gmail.com</p>
        <p>Instagram: <a href="https://instagram.com/alex_renbarger_art" target="_blank" rel="noopener noreferrer">@alex_renbarger_art</a></p></p>
        <p>402-782-1292</p>
    </section>

    <!-- ── MODAL ── -->
    <div class="modal" id="imageModal" role="dialog" aria-modal="true" aria-label="Artwork viewer">
        <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>

        <div class="modal-content">
            <img id="modalImage" src="" alt="Selected artwork">
            <div class="modal-info">
                <h2 id="modalTitle"></h2>
                <p id="modalMedium"></p>
                <p id="modalSize"></p>
            </div>
        </div>

        <div class="modal-nav">
            <button onclick="navigateImages(-1)" aria-label="Previous image">&#10094;</button>
            <button onclick="navigateImages(1)"  aria-label="Next image">&#10095;</button>
        </div>
    </div>

    <script src="js/modal.js"></script>
</body>
</html>
